# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "ci" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    defaults:
      run:
        shell: bash -l {0}

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Create environment
        id: create_env
        run: |
          uv venv --python 3.11 .venv_lint
          source .venv_lint/bin/activate

      - name: Install Ruff
        run: |
          source .venv_lint/bin/activate
          uv pip install ruff==0.11.12

      - name: Run Ruff
        run: |
          source .venv_lint/bin/activate
          ruff check src/ --output-format=github

  linux-x86-gpu:

    defaults:
      run:
        shell: bash -l {0}

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v3

    - name: Fetch versioned test data
      env:
        PTYCHO_CI_DATA_URL: ${{ secrets.PTYCHO_CI_DATA_URL }}
        PTYCHO_CI_CACHE_DIR: ${{ vars.PTYCHO_CI_CACHE_DIR }}
      run: |
        : "${PTYCHO_CI_DATA_URL:?Set the PTYCHO_CI_DATA_URL repository secret}"
        PTYCHO_CI_CACHE_DIR="${PTYCHO_CI_CACHE_DIR:-$(dirname "$GITHUB_WORKSPACE")/.dvc-cache}"
        uv tool run --from 'dvc[ssh]==3.67.1' dvc cache dir --local "$PTYCHO_CI_CACHE_DIR"
        uv tool run --from 'dvc[ssh]==3.67.1' dvc remote add --local --force -d testdata "$PTYCHO_CI_DATA_URL"
        uv tool run --from 'dvc[ssh]==3.67.1' dvc pull

    - name: Create environment
      id: create_env
      run: |
        uv venv --python 3.11 .venv_pytest
        source .venv_pytest/bin/activate

    - name: Install dependencies
      run: |
        source .venv_pytest/bin/activate
        uv sync --active --locked

    - name: List build environment
      run: |
        source .venv_pytest/bin/activate
        uv pip list

    - name: Test with pytest
      run: |
        source .venv_pytest/bin/activate
        echo $(which python)
        unset PTYCHO_CI_DATA_DIR
        cd tests
        uv run --active --locked --with torch==2.12.1 --with torchvision pytest -s --high-tol --save-timing

    - name: Remove environment
      if: always()
      run: |
        source .venv_pytest/bin/deactivate
        rm -rf .venv_pytest
